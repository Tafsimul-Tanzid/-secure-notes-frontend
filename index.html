<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Secure Notes</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- login / register -->
  <main id="auth" class="auth">
    <div class="auth-card card">
      <div class="brand brand-lg"><span class="logo">SN</span> Secure Notes</div>
      <p class="muted">Sign in to manage your notes.</p>

      <div class="tabs" role="tablist">
        <button type="button" class="tab active" data-auth-tab="login">Login</button>
        <button type="button" class="tab" data-auth-tab="register">Register</button>
      </div>

      <form id="login-form" class="stack">
        <label>Email <input name="email" type="email" autocomplete="email" required></label>
        <label>Password <input name="password" type="password" autocomplete="current-password" required></label>
        <button class="btn btn-primary btn-block">Login</button>
      </form>

      <form id="register-form" class="stack hidden">
        <label>Name <input name="name" autocomplete="name" required></label>
        <label>Email <input name="email" type="email" autocomplete="email" required></label>
        <label>Password <input name="password" type="password" autocomplete="new-password" minlength="8" maxlength="72" required>
          <small class="muted">8 to 72 characters</small>
        </label>
        <label>Interests <input name="interests" placeholder="chess, reading, coding">
          <small class="muted">Comma separated, optional</small>
        </label>
        <button class="btn btn-primary btn-block">Create account</button>
      </form>
    </div>
  </main>

  <!-- logged in -->
  <div id="app" class="hidden">
    <header class="topbar">
      <div class="topbar-inner">
        <div class="brand"><span class="logo">SN</span> Secure Notes</div>
        <nav class="nav">
          <button type="button" class="nav-link active" data-view="notes">Notes</button>
          <button type="button" class="nav-link admin-only" data-view="users">Users</button>
        </nav>
        <div class="user-menu">
          <span class="avatar" id="me-avatar"></span>
          <span class="user-name" id="me-name"></span>
          <span class="badge" id="me-role"></span>
          <button type="button" class="btn btn-ghost btn-sm" id="logout">Logout</button>
        </div>
      </div>
    </header>

    <main class="container">
      <!-- notes -->
      <section id="view-notes">
        <div class="page-head">
          <div>
            <h1 id="notes-title">My notes</h1>
            <p class="muted" id="notes-subtitle">Only you can see these.</p>
          </div>
          <button type="button" class="btn btn-primary" id="note-new">+ New note</button>
        </div>

        <form id="note-form" class="card editor hidden">
          <h2 id="note-form-title">New note</h2>
          <input name="id" type="hidden">
          <label>Title <input name="title" maxlength="200" required></label>
          <label>Content <textarea name="content" rows="5" maxlength="20000"></textarea></label>
          <div class="actions">
            <button type="button" class="btn btn-ghost" id="note-cancel">Cancel</button>
            <button class="btn btn-primary">Save note</button>
          </div>
        </form>

        <div id="notes" class="note-grid"></div>
        <div id="notes-pager" class="pager"></div>
      </section>

      <!-- users, admin only -->
      <section id="view-users" class="hidden">
        <div class="page-head">
          <div>
            <h1>Users</h1>
            <p class="muted">Create, edit and remove accounts.</p>
          </div>
          <button type="button" class="btn btn-primary" id="user-new">+ Add user</button>
        </div>

        <form id="user-form" class="card editor hidden">
          <h2 id="user-form-title">Add user</h2>
          <input name="id" type="hidden">
          <div class="form-grid">
            <label>Name <input name="name" required></label>
            <label>Email <input name="email" type="email" required></label>
            <label>Password <input name="password" type="password" autocomplete="new-password" minlength="8" maxlength="72">
              <small class="muted" id="user-password-hint">Required for new users</small>
            </label>
            <label>Role
              <select name="role"><option value="user">User</option><option value="admin">Admin</option></select>
            </label>
            <label class="span-2">Interests <input name="interests" placeholder="chess, reading, coding"></label>
          </div>
          <div class="actions">
            <button type="button" class="btn btn-ghost" id="user-cancel">Cancel</button>
            <button class="btn btn-primary">Save user</button>
          </div>
        </form>

        <div class="card table-wrap">
          <table class="table">
            <thead>
              <tr><th>Name</th><th>Email</th><th>Role</th><th>Interests</th><th>Joined</th><th></th></tr>
            </thead>
            <tbody id="users"></tbody>
          </table>
        </div>
        <div id="users-pager" class="pager"></div>
      </section>
    </main>
  </div>

  <div id="toasts" class="toasts" aria-live="polite"></div>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
